<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Riverbrand Enterprise Banking Engine - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Authoritative Technical & Architectural Reference Suite for Riverbrand Enterprise Banking Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Dark / Light Mode -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" id="theme-light">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" id="theme-dark" disabled>
  
  <!-- Custom Styling for Modern Financial Aesthetic -->
  <style>
    :root {
      --theme-color: #2563eb;
      --sidebar-width: 320px;
    }
    .sidebar {
      font-size: 15px;
    }
    .sidebar-nav li a {
      font-weight: 500;
    }
    .markdown-section {
      max-width: 900px;
      padding: 30px 45px 40px;
    }
    .theme-toggle-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 100;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      transition: all 0.2s ease;
    }
    .theme-toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37,99,235,0.4);
    }
  </style>
</head>
<body>
  <button class="theme-toggle-btn" onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
  <div id="app">Loading Riverbrand Banking Documentation...</div>

  <script>
    window.$docsify = {
      name: '🏦 Riverbrand Banking Docs',
      loadSidebar: '_sidebar.md',
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search docs...',
        noData: 'No matching documentation found!',
        depth: 6
      },
      copyCode: {
        buttonText: '📋 Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'PREVIOUS CHAPTER',
        nextText: 'NEXT CHAPTER',
        crossChapter: true
      }
    }

    function toggleTheme() {
      const lightTheme = document.getElementById('theme-light');
      const darkTheme = document.getElementById('theme-dark');
      const btn = document.querySelector('.theme-toggle-btn');
      
      if (lightTheme.disabled) {
        lightTheme.disabled = false;
        darkTheme.disabled = true;
        btn.innerText = '🌙 Toggle Dark Mode';
      } else {
        lightTheme.disabled = true;
        darkTheme.disabled = false;
        btn.innerText = '☀️ Toggle Light Mode';
      }
    }
  </script>

  <!-- Docsify Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- Code Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
