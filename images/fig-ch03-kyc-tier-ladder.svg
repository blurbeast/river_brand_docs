<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f8fafc"/>

  <!-- Title -->
  <text x="32" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The KYC Ladder</text>
  <text x="32" y="58" font-size="12" fill="#64748b" text-anchor="start" font-style="italic">Higher tiers unlock more room for money to move.</text>

  <!-- Staircase -->
  <path d="M 120 580 L 120 470 L 360 470 L 360 370 L 600 370 L 600 270 L 840 270 L 840 580 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>

  <!-- Tier 1 card -->
  <rect x="140" y="400" width="200" height="70" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="140" y="400" width="8" height="70" rx="4" fill="#0f766e"/>
  <text x="162" y="426" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Tier 1</text>
  <text x="162" y="448" font-size="12" fill="#334155" text-anchor="start">Starter &#8212; small balances</text>

  <!-- Tier 2 card -->
  <rect x="380" y="300" width="200" height="70" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="380" y="300" width="8" height="70" rx="4" fill="#0f766e"/>
  <text x="402" y="326" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Tier 2</text>
  <text x="402" y="348" font-size="12" fill="#334155" text-anchor="start">Verified &#8212; everyday banking</text>

  <!-- Tier 3 card -->
  <rect x="620" y="200" width="200" height="70" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="620" y="200" width="8" height="70" rx="4" fill="#0f766e"/>
  <text x="642" y="226" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Tier 3</text>
  <text x="642" y="248" font-size="12" fill="#334155" text-anchor="start">Full &#8212; business scale</text>

  <!-- Person climbing -->
  <circle cx="350" cy="436" r="8" fill="#0f766e"/>
  <rect x="341" y="446" width="18" height="24" rx="9" fill="#0f766e"/>
  <path d="M 364 428 C 376 412, 386 400, 398 388" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="412" y="472" font-size="12" fill="#0f766e" text-anchor="middle" font-style="italic">climbing up</text>

  <!-- Holding room -->
  <rect x="60" y="520" width="230" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="76" y="548" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="start">Holding room</text>
  <text x="76" y="570" font-size="12" fill="#334155" text-anchor="start">excess funds wait here</text>

  <!-- Red arrow to the step being climbed -->
  <path d="M 292 528 C 360 510, 400 430, 432 378" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <text x="330" y="556" font-size="12" fill="#dc2626" text-anchor="start" font-style="italic">released on upgrade</text>

  <!-- Illustrative note -->
  <text x="32" y="616" font-size="12" fill="#64748b" text-anchor="start" font-style="italic">limits illustrative &#8212; see &#167;3.4</text>
</svg>
