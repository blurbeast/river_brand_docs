<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">From 5,000 to 50</text>

  <!-- Left: crowd of clients -->
  <g fill="#0f766e">
    <circle cx="85" cy="170" r="7"/><circle cx="115" cy="170" r="7"/><circle cx="145" cy="170" r="7"/><circle cx="175" cy="170" r="7"/><circle cx="205" cy="170" r="7"/><circle cx="235" cy="170" r="7"/>
    <circle cx="85" cy="205" r="7"/><circle cx="115" cy="205" r="7"/><circle cx="145" cy="205" r="7"/><circle cx="175" cy="205" r="7"/><circle cx="205" cy="205" r="7"/><circle cx="235" cy="205" r="7"/>
    <circle cx="85" cy="240" r="7"/><circle cx="115" cy="240" r="7"/><circle cx="145" cy="240" r="7"/><circle cx="175" cy="240" r="7"/><circle cx="205" cy="240" r="7"/><circle cx="235" cy="240" r="7"/>
    <circle cx="85" cy="275" r="7"/><circle cx="115" cy="275" r="7"/><circle cx="145" cy="275" r="7"/><circle cx="175" cy="275" r="7"/><circle cx="205" cy="275" r="7"/><circle cx="235" cy="275" r="7"/>
    <circle cx="85" cy="310" r="7"/><circle cx="115" cy="310" r="7"/><circle cx="145" cy="310" r="7"/><circle cx="175" cy="310" r="7"/><circle cx="205" cy="310" r="7"/><circle cx="235" cy="310" r="7"/>
    <circle cx="85" cy="345" r="7"/><circle cx="115" cy="345" r="7"/><circle cx="145" cy="345" r="7"/><circle cx="175" cy="345" r="7"/><circle cx="205" cy="345" r="7"/><circle cx="235" cy="345" r="7"/>
  </g>
  <text x="160" y="398" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">5,000 clients</text>

  <!-- Arrow into funnel -->
  <line x1="260" y1="258" x2="318" y2="258" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Middle: funnel (trapezoid), amber accent -->
  <path d="M330 150 L530 150 L478 400 L382 400 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="430" y="255" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">PgBouncer</text>
  <text x="430" y="282" font-size="13" fill="#334155" text-anchor="middle">transaction pooling</text>
  <text x="430" y="440" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">one pool, many sessions</text>

  <!-- Right: thick pooled connections -->
  <g stroke="#d97706" stroke-width="5" marker-end="url(#arrow-amber)">
    <line x1="530" y1="212" x2="726" y2="212"/>
    <line x1="528" y1="248" x2="726" y2="248"/>
    <line x1="526" y1="284" x2="726" y2="284"/>
    <line x1="524" y1="320" x2="726" y2="320"/>
    <line x1="522" y1="356" x2="726" y2="356"/>
    <line x1="520" y1="392" x2="726" y2="392"/>
  </g>

  <!-- DB cylinder -->
  <g>
    <ellipse cx="810" cy="180" rx="72" ry="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <rect x="738" y="180" width="144" height="230" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <path d="M738 180 L738 410" fill="none" stroke="#0f766e" stroke-width="3"/>
    <path d="M882 180 L882 410" fill="none" stroke="#0f766e" stroke-width="3"/>
    <ellipse cx="810" cy="410" rx="72" ry="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <path d="M738 257 Q810 277 882 257" fill="none" stroke="#0f766e" stroke-width="2"/>
    <path d="M738 334 Q810 354 882 334" fill="none" stroke="#0f766e" stroke-width="2"/>
    <text x="810" y="305" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">database</text>
    <text x="810" y="470" font-size="15" font-weight="bold" fill="#d97706" text-anchor="middle">50 database connections</text>
  </g>
</svg>
