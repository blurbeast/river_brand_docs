<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="32" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">Every Transfer Is Two Entries</text>
  <text x="32" y="58" font-size="12" fill="#64748b" text-anchor="start" font-style="italic">One payment, two balanced lines. Always.</text>

  <!-- T-account card -->
  <rect x="180" y="100" width="600" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- One transfer label -->
  <text x="480" y="132" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">one transfer</text>
  <path d="M 480 140 C 420 152, 380 160, 350 172" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 140 C 540 152, 580 160, 610 172" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- The T -->
  <line x1="220" y1="186" x2="740" y2="186" stroke="#1e293b" stroke-width="3"/>
  <line x1="480" y1="186" x2="480" y2="338" stroke="#1e293b" stroke-width="3"/>

  <!-- Column headers -->
  <text x="350" y="178" font-size="12" fill="#64748b" text-anchor="middle">money out</text>
  <text x="610" y="178" font-size="12" fill="#64748b" text-anchor="middle">money in</text>

  <!-- Left: From (red) -->
  <text x="238" y="228" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="start">From: Amina&#8217;s wallet</text>
  <circle cx="250" cy="262" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="267" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">&#8358;</text>
  <text x="270" y="268" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="start">&#8722;&#8358;20,000</text>
  <text x="238" y="300" font-size="12" fill="#64748b" text-anchor="start">debit entry</text>

  <!-- Right: To (green) -->
  <text x="502" y="228" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="start">To: Tunde&#8217;s wallet</text>
  <circle cx="514" cy="262" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="514" y="267" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">&#8358;</text>
  <text x="534" y="268" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="start">+&#8358;20,000</text>
  <text x="502" y="300" font-size="12" fill="#64748b" text-anchor="start">credit entry</text>

  <!-- Balance note -->
  <text x="480" y="356" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">out and in are equal — the ledger stays balanced</text>

  <!-- Slate takeaway card -->
  <rect x="280" y="420" width="400" height="76" rx="12" fill="#1e293b"/>
  <text x="480" y="450" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">One transfer, two entries.</text>
  <text x="480" y="474" font-size="13" fill="#e2e8f0" text-anchor="middle">The books never lie.</text>
</svg>
