<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="32" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The Riverbrand Product Map</text>
  <text x="32" y="58" font-size="12" fill="#64748b" text-anchor="start" font-style="italic">Channels feed the engine. The engine talks to the rails.</text>

  <!-- Channel card 1: Mobile App -->
  <rect x="40" y="110" width="170" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#0f766e" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="58" y="132" width="20" height="36" rx="4"/>
    <line x1="63" y1="163" x2="73" y2="163"/>
  </g>
  <circle cx="68" cy="138" r="1.5" fill="#0f766e"/>
  <text x="94" y="152" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Mobile App</text>
  <text x="94" y="172" font-size="12" fill="#64748b" text-anchor="start">iOS &amp; Android</text>

  <!-- Channel card 2: Web Dashboard -->
  <rect x="40" y="240" width="170" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#0f766e" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="56" y="262" width="38" height="28" rx="3"/>
    <line x1="56" y1="271" x2="94" y2="271"/>
  </g>
  <circle cx="62" cy="266.5" r="1.5" fill="#0f766e"/>
  <circle cx="68" cy="266.5" r="1.5" fill="#0f766e"/>
  <text x="104" y="274" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Web Dashboard</text>
  <text x="104" y="294" font-size="12" fill="#64748b" text-anchor="start">browser console</text>

  <!-- Channel card 3: WhatsApp Chat -->
  <rect x="40" y="370" width="170" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 62 392 h 28 a 7 7 0 0 1 7 7 v 14 a 7 7 0 0 1 -7 7 h -16 l -11 8 v -8 h -1 a 7 7 0 0 1 -7 -7 v -14 a 7 7 0 0 1 7 -7 z" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
  <text x="104" y="404" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">WhatsApp Chat</text>
  <text x="104" y="424" font-size="12" fill="#64748b" text-anchor="start">WhatsApp banking</text>

  <!-- Channel -> engine arrows -->
  <line x1="214" y1="160" x2="284" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="290" x2="284" y2="290" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="420" x2="284" y2="420" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Engine card -->
  <rect x="290" y="100" width="340" height="370" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="460" y="142" font-size="18" font-weight="bold" fill="#0f766e" text-anchor="middle">RiverbrandBE</text>
  <text x="460" y="164" font-size="13" fill="#334155" text-anchor="middle">the banking engine</text>

  <!-- Engine sub-chips -->
  <rect x="310" y="190" width="300" height="48" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="460" y="219" font-size="13" fill="#334155" text-anchor="middle">Double-Entry Ledger</text>

  <rect x="310" y="248" width="300" height="48" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="460" y="277" font-size="13" fill="#334155" text-anchor="middle">Wallets (5 currencies)</text>

  <rect x="310" y="306" width="300" height="48" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="460" y="335" font-size="13" fill="#334155" text-anchor="middle">Compliance &amp; KYC</text>

  <rect x="310" y="364" width="300" height="48" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="460" y="393" font-size="13" fill="#334155" text-anchor="middle">Security</text>

  <!-- Engine -> provider arrows -->
  <line x1="634" y1="142" x2="694" y2="142" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="222" x2="694" y2="222" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="302" x2="694" y2="302" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="382" x2="694" y2="382" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="462" x2="694" y2="462" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Provider cards -->
  <rect x="700" y="110" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="718" y="136" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">ProvidusBank &amp; Fincra</text>
  <text x="718" y="156" font-size="12" fill="#64748b" text-anchor="start">virtual accounts</text>

  <rect x="700" y="190" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="718" y="216" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">Flutterwave</text>
  <text x="718" y="236" font-size="12" fill="#64748b" text-anchor="start">cards &amp; bills</text>

  <rect x="700" y="270" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="718" y="296" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">Dojah</text>
  <text x="718" y="316" font-size="12" fill="#64748b" text-anchor="start">identity checks</text>

  <rect x="700" y="350" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="718" y="376" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">WhatsApp providers</text>
  <text x="718" y="396" font-size="12" fill="#64748b" text-anchor="start">messaging channel</text>

  <rect x="700" y="430" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="718" y="456" font-size="13" font-weight="bold" fill="#334155" text-anchor="start">Push &amp; Email</text>
  <text x="718" y="476" font-size="12" fill="#64748b" text-anchor="start">notifications</text>

  <!-- Amber money-flow arrow -->
  <path d="M 460 470 L 460 512 L 940 512 L 940 120 L 926 120" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="472" y="506" font-size="12" fill="#d97706" text-anchor="start" font-style="italic">money movement</text>
</svg>
