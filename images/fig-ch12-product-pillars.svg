<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The Six Aisles</text>

  <!-- Header pill -->
  <rect x="320" y="82" width="320" height="40" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="480" y="108" font-size="15" font-weight="bold" fill="#0f766e" text-anchor="middle">Riverbrand Product Catalog</text>

  <!-- Person with cart -->
  <g>
    <circle cx="78" cy="252" r="15" fill="#1e293b"/>
    <rect x="63" y="272" width="30" height="56" rx="13" fill="#1e293b"/>
    <rect x="68" y="330" width="9" height="34" rx="4" fill="#1e293b"/>
    <rect x="81" y="330" width="9" height="34" rx="4" fill="#1e293b"/>
    <!-- cart -->
    <path d="M104 300 L140 300 L134 336 L110 336 Z" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <line x1="98" y1="290" x2="108" y2="300" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="114" cy="348" r="6" fill="#64748b"/>
    <circle cx="132" cy="348" r="6" fill="#64748b"/>
    <text x="108" y="392" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">walking the aisles</text>
  </g>

  <!-- Aisle 1: Identity & Accounts -->
  <g>
    <rect x="170" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="170" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="227" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="212" y="204" width="30" height="20" rx="3" fill="none" stroke="#0f766e" stroke-width="2"/>
    <circle cx="220" cy="214" r="4" fill="#0f766e"/>
    <line x1="228" y1="211" x2="238" y2="211" stroke="#0f766e" stroke-width="2"/>
    <line x1="228" y1="218" x2="238" y2="218" stroke="#0f766e" stroke-width="2"/>
    <text x="227" y="320" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Identity &amp;</text>
    <text x="227" y="340" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Accounts</text>
  </g>

  <!-- Aisle 2: Money Movement -->
  <g>
    <rect x="297" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="297" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="354" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <line x1="340" y1="208" x2="368" y2="208" stroke="#0f766e" stroke-width="2"/>
    <path d="M362 202 L368 208 L362 214" fill="none" stroke="#0f766e" stroke-width="2"/>
    <line x1="368" y1="222" x2="340" y2="222" stroke="#0f766e" stroke-width="2"/>
    <path d="M346 216 L340 222 L346 228" fill="none" stroke="#0f766e" stroke-width="2"/>
    <text x="354" y="320" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Money</text>
    <text x="354" y="340" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Movement</text>
  </g>

  <!-- Aisle 3: Wealth -->
  <g>
    <rect x="424" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="424" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="481" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="469" y="204" width="24" height="24" rx="6" fill="none" stroke="#0f766e" stroke-width="2"/>
    <line x1="475" y1="210" x2="487" y2="210" stroke="#0f766e" stroke-width="2"/>
    <line x1="481" y1="204" x2="481" y2="228" stroke="#0f766e" stroke-width="2"/>
    <text x="481" y="330" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Wealth</text>
  </g>

  <!-- Aisle 4: Multi-Currency -->
  <g>
    <rect x="551" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="551" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="608" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <circle cx="601" cy="215" r="11" fill="none" stroke="#0f766e" stroke-width="2"/>
    <circle cx="615" cy="215" r="11" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="608" y="320" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Multi-</text>
    <text x="608" y="340" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Currency</text>
  </g>

  <!-- Aisle 5: WhatsApp Banking -->
  <g>
    <rect x="678" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="678" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="735" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="722" y="204" width="26" height="18" rx="5" fill="none" stroke="#0f766e" stroke-width="2"/>
    <path d="M728 222 L726 229 L735 222" fill="#0f766e"/>
    <text x="735" y="320" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">WhatsApp</text>
    <text x="735" y="340" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Banking</text>
  </g>

  <!-- Aisle 6: Governance -->
  <g>
    <rect x="805" y="150" width="115" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="805" y="150" width="115" height="10" rx="5" fill="#0f766e"/>
    <circle cx="862" cy="215" r="27" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <path d="M862 202 L873 207 L873 217 C873 224 862 229 862 229 C862 229 851 224 851 217 L851 207 Z" fill="none" stroke="#0f766e" stroke-width="2"/>
    <line x1="862" y1="208" x2="862" y2="222" stroke="#0f766e" stroke-width="2"/>
    <text x="862" y="330" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Governance</text>
  </g>

  <!-- Caption -->
  <text x="545" y="500" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">one catalog, six aisles &#8212; every product has a shelf</text>
</svg>
