<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">Two Doors, Two Keys</text>

  <!-- LEFT: App key -->
  <g>
    <circle cx="150" cy="255" r="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <circle cx="150" cy="255" r="9" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
    <rect x="174" y="248" width="88" height="14" rx="3" fill="#0f766e"/>
    <rect x="226" y="262" width="10" height="16" rx="2" fill="#0f766e"/>
    <rect x="246" y="262" width="10" height="16" rx="2" fill="#0f766e"/>
    <text x="196" y="330" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">App key</text>
  </g>

  <!-- LEFT arrow + door -->
  <line x1="285" y1="255" x2="335" y2="255" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="345" y="185" width="90" height="150" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <rect x="345" y="185" width="90" height="18" rx="8" fill="#0f766e"/>
    <circle cx="418" cy="265" r="6" fill="#0f766e"/>
    <text x="390" y="392" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Mobile channel</text>
  </g>

  <!-- CENTER red cross -->
  <g stroke="#dc2626" stroke-width="6" stroke-linecap="round">
    <line x1="458" y1="232" x2="502" y2="278"/>
    <line x1="502" y1="232" x2="458" y2="278"/>
  </g>
  <text x="480" y="358" font-size="13" fill="#dc2626" text-anchor="middle">app key cannot open web door</text>

  <!-- RIGHT door -->
  <g>
    <rect x="545" y="185" width="90" height="150" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <rect x="545" y="185" width="90" height="18" rx="8" fill="#0f766e"/>
    <circle cx="562" cy="265" r="6" fill="#0f766e"/>
    <text x="590" y="392" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Web channel</text>
  </g>

  <!-- RIGHT arrow (pointing left toward web door) -->
  <line x1="688" y1="255" x2="645" y2="255" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-back)"/>

  <!-- RIGHT: Web key -->
  <g>
    <circle cx="812" cy="255" r="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <circle cx="812" cy="255" r="9" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
    <rect x="702" y="248" width="88" height="14" rx="3" fill="#0f766e"/>
    <rect x="708" y="262" width="10" height="16" rx="2" fill="#0f766e"/>
    <rect x="728" y="262" width="10" height="16" rx="2" fill="#0f766e"/>
    <text x="766" y="330" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Web key</text>
  </g>

  <!-- Central bank icon -->
  <g>
    <path d="M412 432 L480 402 L548 432 Z" fill="#0f766e"/>
    <rect x="436" y="432" width="14" height="38" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="473" y="432" width="14" height="38" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="510" y="432" width="14" height="38" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="416" y="470" width="128" height="12" rx="3" fill="#0f766e"/>
    <text x="480" y="512" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Central bank</text>
  </g>
</svg>
