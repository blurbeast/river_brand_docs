<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The Control Tower</text>

  <!-- Sky band -->
  <rect x="80" y="88" width="800" height="185" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="115" font-size="12" font-style="italic" fill="#64748b" text-anchor="start">customer traffic</text>

  <!-- Planes (abstract paper-plane paths) -->
  <g fill="#1e293b">
    <path d="M140 145 L172 133 L158 145 L172 157 Z"/>
    <path d="M290 195 L322 183 L308 195 L322 207 Z"/>
    <path d="M440 138 L472 126 L458 138 L472 150 Z"/>
    <path d="M600 200 L632 188 L618 200 L632 212 Z"/>
    <path d="M745 142 L777 130 L763 142 L777 154 Z"/>
    <path d="M845 215 L877 203 L863 215 L877 227 Z"/>
  </g>

  <!-- Dotted approach paths to the tower -->
  <g fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 6">
    <path d="M175 165 Q300 260 468 318"/>
    <path d="M322 212 Q400 280 472 320"/>
    <path d="M468 158 Q480 240 476 316"/>
    <path d="M630 218 Q560 280 492 320"/>
    <path d="M775 162 Q640 250 500 318"/>
    <path d="M872 232 Q700 300 505 322"/>
  </g>

  <!-- Tower -->
  <g>
    <!-- antenna -->
    <line x1="480" y1="268" x2="480" y2="300" stroke="#0f766e" stroke-width="3"/>
    <circle cx="480" cy="264" r="5" fill="#0f766e"/>
    <!-- roof -->
    <path d="M434 322 L480 296 L526 322 Z" fill="#0f766e"/>
    <!-- cabin -->
    <rect x="444" y="322" width="72" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="456" y="332" width="48" height="24" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <!-- stem -->
    <path d="M458 374 L502 374 L512 452 L448 452 Z" fill="#0f766e"/>
    <!-- base -->
    <rect x="434" y="452" width="92" height="12" rx="3" fill="#0f766e"/>
    <!-- label -->
    <text x="480" y="492" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">PgBouncer — the control tower</text>
  </g>

  <!-- Caption -->
  <text x="480" y="522" font-size="13" fill="#334155" text-anchor="middle">thousands of customers, a small trusted crew of connections</text>
  <text x="480" y="544" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">(5,000 &#8594; 50)</text>
</svg>
