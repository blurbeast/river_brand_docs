<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The Service Map</text>

  <!-- Engine circle (center-left) -->
  <g>
    <circle cx="115" cy="305" r="52" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <circle cx="115" cy="305" r="38" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="115" y="310" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">RiverbrandBE</text>
  </g>
  <!-- connectors from engine to grid -->
  <g stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)">
    <line x1="172" y1="270" x2="205" y2="230"/>
    <line x1="172" y1="305" x2="205" y2="305"/>
    <line x1="172" y1="340" x2="205" y2="380"/>
  </g>

  <!-- Card 1: Auth & Security -->
  <g>
    <rect x="212" y="100" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="212" y="100" width="168" height="10" rx="5" fill="#0f766e"/>
    <text x="296" y="137" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Auth &amp; Security</text>
    <rect x="226" y="150" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="165" font-size="11" fill="#334155" text-anchor="middle">auth.ts</text>
    <rect x="226" y="178" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="193" font-size="11" fill="#334155" text-anchor="middle">session.ts</text>
    <rect x="226" y="206" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="221" font-size="11" fill="#334155" text-anchor="middle">rbac.ts</text>
    <rect x="226" y="234" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="249" font-size="11" fill="#334155" text-anchor="middle">token.ts</text>
  </g>

  <!-- Card 2: Financial & Wallet -->
  <g>
    <rect x="394" y="100" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="394" y="100" width="168" height="10" rx="5" fill="#d97706"/>
    <text x="478" y="137" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Financial &amp; Wallet</text>
    <rect x="408" y="150" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="165" font-size="11" fill="#334155" text-anchor="middle">wallet.ts</text>
    <rect x="408" y="178" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="193" font-size="11" fill="#334155" text-anchor="middle">ledger.ts</text>
    <rect x="408" y="206" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="221" font-size="11" fill="#334155" text-anchor="middle">balance.ts</text>
    <rect x="408" y="234" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="249" font-size="11" fill="#334155" text-anchor="middle">statement.ts</text>
  </g>

  <!-- Card 3: Payments -->
  <g>
    <rect x="576" y="100" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="576" y="100" width="168" height="10" rx="5" fill="#d97706"/>
    <text x="660" y="137" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Payments</text>
    <rect x="590" y="150" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="165" font-size="11" fill="#334155" text-anchor="middle">transaction.ts</text>
    <rect x="590" y="178" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="193" font-size="11" fill="#334155" text-anchor="middle">transfer.ts</text>
    <rect x="590" y="206" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="221" font-size="11" fill="#334155" text-anchor="middle">webhook.ts</text>
    <rect x="590" y="234" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="249" font-size="11" fill="#334155" text-anchor="middle">payout.ts</text>
  </g>

  <!-- Card 4: Wealth -->
  <g>
    <rect x="758" y="100" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="758" y="100" width="168" height="10" rx="5" fill="#d97706"/>
    <text x="842" y="137" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Wealth</text>
    <rect x="772" y="150" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="842" y="165" font-size="11" fill="#334155" text-anchor="middle">savings.ts</text>
    <rect x="772" y="178" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="842" y="193" font-size="11" fill="#334155" text-anchor="middle">portfolio.ts</text>
    <rect x="772" y="206" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="842" y="221" font-size="11" fill="#334155" text-anchor="middle">interest.ts</text>
    <rect x="772" y="234" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="842" y="249" font-size="11" fill="#334155" text-anchor="middle">fund.ts</text>
  </g>

  <!-- Card 5: KYC & Users -->
  <g>
    <rect x="212" y="300" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="212" y="300" width="168" height="10" rx="5" fill="#0ea5e9"/>
    <text x="296" y="337" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">KYC &amp; Users</text>
    <rect x="226" y="350" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="365" font-size="11" fill="#334155" text-anchor="middle">kyc.ts</text>
    <rect x="226" y="378" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="393" font-size="11" fill="#334155" text-anchor="middle">profile.ts</text>
    <rect x="226" y="406" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="421" font-size="11" fill="#334155" text-anchor="middle">onboarding.ts</text>
    <rect x="226" y="434" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="449" font-size="11" fill="#334155" text-anchor="middle">consent.ts</text>
  </g>

  <!-- Card 6: Messaging -->
  <g>
    <rect x="394" y="300" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="394" y="300" width="168" height="10" rx="5" fill="#0ea5e9"/>
    <text x="478" y="337" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Messaging</text>
    <rect x="408" y="350" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="365" font-size="11" fill="#334155" text-anchor="middle">whatsapp/*</text>
    <rect x="408" y="378" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="393" font-size="11" fill="#334155" text-anchor="middle">notify.ts</text>
    <rect x="408" y="406" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="421" font-size="11" fill="#334155" text-anchor="middle">templates/*</text>
    <rect x="408" y="434" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="449" font-size="11" fill="#334155" text-anchor="middle">inbox.ts</text>
  </g>

  <!-- Card 7: Platform & Jobs -->
  <g>
    <rect x="576" y="300" width="168" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="576" y="300" width="168" height="10" rx="5" fill="#1e293b"/>
    <text x="660" y="337" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Platform &amp; Jobs</text>
    <rect x="590" y="350" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="365" font-size="11" fill="#334155" text-anchor="middle">jobs/*</text>
    <rect x="590" y="378" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="393" font-size="11" fill="#334155" text-anchor="middle">queue.ts</text>
    <rect x="590" y="406" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="421" font-size="11" fill="#334155" text-anchor="middle">config.ts</text>
    <rect x="590" y="434" width="140" height="22" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="449" font-size="11" fill="#334155" text-anchor="middle">metrics.ts</text>
  </g>

  <!-- Empty grid slot note -->
  <g>
    <rect x="758" y="300" width="168" height="165" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="842" y="388" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">room to grow</text>
  </g>

  <!-- Caption -->
  <text x="540" y="512" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">seven groups, one engine &#8212; services speak through RiverbrandBE</text>
</svg>
