<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="start">The Instant Kill-Switch</text>

  <!-- Phone card -->
  <g>
    <rect x="110" y="120" width="190" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="130" y="160" width="150" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="205" cy="140" r="4" fill="#cbd5e1"/>
    <!-- session v3 badge -->
    <rect x="155" y="325" width="90" height="30" rx="15" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="200" y="345" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">v3</text>
    <!-- expired badge -->
    <rect x="145" y="372" width="120" height="30" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="392" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">expired</text>
    <text x="205" y="412" font-size="11" fill="#64748b" text-anchor="middle">session v3</text>
  </g>

  <!-- Live arrow (teal solid) -->
  <line x1="320" y1="215" x2="625" y2="215" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="472" y="200" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">live session</text>

  <!-- After-revoke arrow (red dashed) -->
  <line x1="320" y1="265" x2="625" y2="265" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="472" y="292" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">after revoke</text>

  <!-- Shield / sidecar card -->
  <g>
    <rect x="645" y="150" width="230" height="215" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M760 190 L718 210 L718 258 C718 288 760 306 760 306 C760 306 802 288 802 258 L802 210 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <rect x="750" y="232" width="20" height="26" rx="3" fill="#0f766e"/>
    <text x="760" y="332" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Session control</text>
    <text x="760" y="354" font-size="13" fill="#64748b" text-anchor="middle">the sidecar</text>
  </g>

  <!-- Press arrow -->
  <line x1="470" y1="318" x2="470" y2="362" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- Revoke button -->
  <g>
    <rect x="380" y="366" width="180" height="54" rx="27" fill="#dc2626"/>
    <text x="470" y="399" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Revoke</text>
  </g>

  <!-- Kill line from button up through the link -->
  <line x1="565" y1="393" x2="625" y2="393" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>

  <!-- Note -->
  <text x="480" y="490" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">revocation checked on every request</text>
</svg>
